<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fonts.css" />
<style>
  * { margin: 0; padding: 0; }
  body { background: #fff; }
  .row { position: absolute; white-space: nowrap; font-size: 200px; }
  #pf-custom { top: 0;   font-family: 'Playfair Display', serif; font-weight: 900; }
  #pf-fallbk { top: 300px; font-family: serif; font-weight: 900; }
  #in-custom { top: 600px; font-family: 'Inter', sans-serif; font-weight: 700; }
  #in-fallbk { top: 900px; font-family: sans-serif; font-weight: 700; }
</style>
</head>
<body>
  <span id="pf-custom" class="row">Waypoint 1234</span>
  <span id="pf-fallbk" class="row">Waypoint 1234</span>
  <span id="in-custom" class="row">Waypoint 1234</span>
  <span id="in-fallbk" class="row">Waypoint 1234</span>
</body>
</html>
