name: Verify Internal Links

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # verify-links.mjs parses front matter with gray-matter (the same parser
      # production uses), so this job needs node_modules. Scripts are skipped:
      # nothing here needs the Prisma client, and postinstall's `prisma generate`
      # only slows the job down.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Runs only the named unit tests, not the whole `unit` project:
      # tests/unit/brand-map-drift.test.ts compares against a registry that lives
      # in a different repository and fails hard when it is absent, which is
      # correct locally and wrong here. Each new test file that guards a content
      # gate has to be listed here explicitly, or it runs in the pre-push hook and
      # silently never runs in CI.
      - name: Verify Links (unit tests)
        run: npx vitest run --project unit tests/unit/verify-links.test.ts
      - name: Content audit (unit tests)
        run: npx vitest run --project unit tests/unit/aeo-audit.test.ts
      - name: Verify Links
        run: node scripts/verify-links.mjs
      # Frontmatter dates. src/lib/githubArticleCommit.ts writes articles straight
      # through the GitHub API, so those commits never touch .githooks/pre-push
      # and this job used to be the only thing that saw them, after the fact. That
      # path now stamps both dates and validates its own serialized output before
      # it advances the ref, so the two suites below cover the two write paths:
      # verify-dates for the corpus on disk, write-path-dates for the bot commits.
      # Same narrow test selection as above, for the same brand-map-registry reason.
      - name: Verify Dates (unit tests)
        run: npx vitest run --project unit tests/unit/verify-dates.test.ts
      - name: Verify Dates, AI write path (unit tests)
        run: npx vitest run --project unit tests/unit/write-path-dates.test.ts
      - name: Verify Dates
        run: node scripts/verify-dates.mjs
      - name: Enforce Content Standards (no em dashes, §11)
        run: node scripts/aeo-audit.mjs
      # Frontmatter FAQ blocks. structured-data.test.ts asserts that every
      # published article still carries a `faqs:` block and that every entry in it
      # survives validFaqEntries untouched, so a stray "-" or a bare-string list
      # item fails HERE rather than silently publishing a shorter FAQ. Listed
      # explicitly for the same reason as the jobs above: this workflow selects
      # test files by name, and githubArticleCommit.ts writes articles straight
      # through the GitHub API, so those commits never reach .githooks/pre-push
      # and this job is their only gate.
      - name: Verify Article FAQ blocks (unit tests)
        run: npx vitest run --project unit tests/unit/structured-data.test.ts
      # Structured-data guardrails, including FAQ schema-vs-visible parity. Needs
      # no dependencies of its own; it runs after the install step only because
      # that step is already there for verify-links.
      - name: Verify Structured Data (FAQ visibility, canonical hosts)
        run: node scripts/verify-schema.mjs
      - name: Verify Structured Data (unit tests)
        run: npx vitest run --project unit tests/unit/faq-visibility.test.ts
