name: Verify Internal Links

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # verify-links.mjs parses front matter with gray-matter (the same parser
      # production uses), so this job needs node_modules. Scripts are skipped:
      # nothing here needs the Prisma client, and postinstall's `prisma generate`
      # only slows the job down.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Runs only the named unit tests, not the whole `unit` project:
      # tests/unit/brand-map-drift.test.ts compares against a registry that lives
      # in a different repository and fails hard when it is absent, which is
      # correct locally and wrong here. Each new test file that guards a content
      # gate has to be listed here explicitly, or it runs in the pre-push hook and
      # silently never runs in CI.
      - name: Verify Links (unit tests)
        run: npx vitest run --project unit tests/unit/verify-links.test.ts
      - name: Content audit (unit tests)
        run: npx vitest run --project unit tests/unit/aeo-audit.test.ts
      - name: Verify Links
        run: node scripts/verify-links.mjs
      # Frontmatter dates. src/lib/githubArticleCommit.ts writes articles straight
      # through the GitHub API, so those commits never touch .githooks/pre-push
      # and this job used to be the only thing that saw them, after the fact. That
      # path now stamps both dates and validates its own serialized output before
      # it advances the ref, so the two suites below cover the two write paths:
      # verify-dates for the corpus on disk, write-path-dates for the bot commits.
      # Same narrow test selection as above, for the same brand-map-registry reason.
      - name: Verify Dates (unit tests)
        run: npx vitest run --project unit tests/unit/verify-dates.test.ts
      - name: Verify Dates, AI write path (unit tests)
        run: npx vitest run --project unit tests/unit/write-path-dates.test.ts
      # The required NON-DATE frontmatter fields on that same bot path. Dates are
      # stamped, so their guard is a backstop; title, excerpt and faqs are taken
      # from model output verbatim and this is the only thing checking them
      # before the commit exists. Listed by name for the same reason as every job
      # above: this workflow selects test files explicitly, so a file that is not
      # named here runs in the pre-push hook and silently never runs in CI.
      - name: Verify required fields, AI write path (unit tests)
        run: npx vitest run --project unit tests/unit/write-path-fields.test.ts
      # The other half of the same commit: WHERE that write path puts the file.
      # The three jobs above check the bytes; this one checks the destination.
      # The slug becomes the path of a tree entry, so this suite covers the
      # format, the payload-slug/frontmatter-slug binding, and duplicate
      # destinations within one batch. It also re-checks every article on disk
      # against the enforced format, so a newly authored slug the refresh would
      # refuse fails here rather than months later as a dropped article.
      - name: Verify Slugs, AI write path (unit tests)
        run: npx vitest run --project unit tests/unit/write-path-slug.test.ts
      # Where that slug COMES FROM, which the job above takes as given. It checks
      # the payload against its own frontmatter at the write boundary; this one
      # covers the step before, in discovery: the live site reads the FILENAME
      # and the refresh preferred the FIELD, so a file whose frontmatter
      # contradicted its own name armed the refresh to commit a duplicate under
      # the other name. Also covers the reviewCadence override.
      # Listed by name for the same reason as every job above.
      - name: Verify article slug identity (unit tests)
        run: npx vitest run --project unit tests/unit/article-slug-identity.test.ts
      # The third decision a commit makes, after WHAT is written and WHERE: may
      # it overwrite the file it is pointed at, or has that file moved since the
      # refresh read it. Listed by name for the same reason as every job above,
      # and it matters more here than anywhere else on this path: the pre-push
      # hook cannot see the refresh at all, because it commits through the GitHub
      # API rather than through git, so this workflow is the only place these
      # ever run. It also cross-checks the blob hash against `git hash-object`
      # for every article on disk.
      - name: Verify concurrent-edit guard, AI write path (unit tests)
        run: npx vitest run --project unit tests/unit/write-path-cas.test.ts
      - name: Verify Dates
        run: node scripts/verify-dates.mjs
      - name: Enforce Content Standards (no em dashes, §11)
        run: node scripts/aeo-audit.mjs
      # Frontmatter FAQ blocks. structured-data.test.ts asserts that every
      # published article still carries a `faqs:` block and that every entry in it
      # survives validFaqEntries untouched, so a stray "-" or a bare-string list
      # item fails HERE rather than silently publishing a shorter FAQ. Listed
      # explicitly for the same reason as the jobs above: this workflow selects
      # test files by name, and githubArticleCommit.ts writes articles straight
      # through the GitHub API, so those commits never reach .githooks/pre-push
      # and this job is their only gate.
      - name: Verify Article FAQ blocks (unit tests)
        run: npx vitest run --project unit tests/unit/structured-data.test.ts
      # Structured-data guardrails, including FAQ schema-vs-visible parity. Needs
      # no dependencies of its own; it runs after the install step only because
      # that step is already there for verify-links.
      - name: Verify Structured Data (FAQ visibility, canonical hosts)
        run: node scripts/verify-schema.mjs
      - name: Verify Structured Data (unit tests)
        run: npx vitest run --project unit tests/unit/faq-visibility.test.ts
      # The deploy-time schema-drift report (scripts/guard-immutable-tables.mjs). Listed by
      # name for the same reason as every job above. It matters here because the squash-merge
      # commit GitHub creates is what actually deploys and never passes through the pre-push
      # hook, so this is the only place these run against the tree that reaches production.
      # Pure string classification over captured Prisma output — no database, no Prisma
      # client, so it is safe under `npm ci --ignore-scripts`.
      - name: Verify schema-drift report (unit tests)
        run: npx vitest run --project unit tests/unit/schema-drift-report.test.ts
      # /llms.txt, the generated agent index, and the route-inventory gate behind
      # it. Listed by name for the same reason as every job above. It matters here
      # because the drift this catches — a page added with no entry in
      # `staticPages` — arrives through ordinary PRs, and the squash-merge commit
      # GitHub creates never passes through .githooks/pre-push. Pure filesystem
      # walk plus content-module reads: no database, no Prisma client, so it is
      # safe under `npm ci --ignore-scripts`.
      - name: Verify llms.txt index and route inventory (unit tests)
        run: npx vitest run --project unit tests/unit/llms-index.test.ts
