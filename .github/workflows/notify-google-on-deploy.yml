name: Notify Search Engines on Deploy

# Renamed from "Notify Google on Deploy". The old name claimed more than the
# workflow delivered: of its three jobs, one pinged an endpoint Google retired in
# 2023, one submitted to a protocol Google does not participate in, and the third
# called an API that rejects this site's content type. See the notes on each job.

on:
  push:
    branches:
      - main
  # Allow manual trigger from the GitHub Actions tab for testing
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────
  # IndexNow
  # Bing, Yandex, Naver, Seznam, Yep and Amazon consume this. Google does NOT —
  # it has never joined IndexNow. A comment here used to claim Google monitors
  # these signals; it does not, and planning around that was wrong.
  #
  # This is the only deploy-time notification in this repo that reaches real
  # search engines, so it is the one worth keeping healthy.
  # ─────────────────────────────────────────────────
  indexnow:
    name: Submit via IndexNow
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sitemap and extract URLs
        id: extract
        run: |
          SITEMAP_URL="https://www.waypointfranchise.com/sitemap.xml"
          echo "Fetching $SITEMAP_URL..."

          # Download sitemap and extract all <loc> values into a JSON array
          SITEMAP_XML=$(curl -sL "$SITEMAP_URL")
          URL_LIST=$(echo "$SITEMAP_XML" \
            | grep -oP '(?<=<loc>)[^<]+' \
            | jq -R . | jq -s .)

          echo "Extracted URLs:"
          echo "$URL_LIST"

          # Save to env for next step
          echo "url_list<<EOF" >> $GITHUB_OUTPUT
          echo "$URL_LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Submit URLs to IndexNow
        run: |
          INDEXNOW_KEY="93b7973196acee37de3cfa2ff2665274a8815cc5e48d2ac193c2313cac442758"
          HOST="waypointfranchise.com"
          KEY_LOCATION="https://${HOST}/${INDEXNOW_KEY}.txt"

          PAYLOAD=$(cat <<EOF
          {
            "host": "$HOST",
            "key": "$INDEXNOW_KEY",
            "keyLocation": "$KEY_LOCATION",
            "urlList": ${{ steps.extract.outputs.url_list }}
          }
          EOF
          )

          # Retried, then fatal. This is the only channel here that reaches a real
          # search engine, so a run where it never succeeded must not report green:
          # a silent warning is how a permanently broken submission goes unnoticed,
          # which is the failure mode this whole workflow just came out of.
          for ATTEMPT in 1 2 3; do
            echo "Submitting to IndexNow (attempt $ATTEMPT)..."
            STATUS=$(curl -s -o /tmp/indexnow_response.txt -w "%{http_code}" \
              -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$PAYLOAD")

            echo "IndexNow response: $STATUS"
            cat /tmp/indexnow_response.txt || true

            # 200 = success, 202 = accepted (queued), both are valid
            if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 202 ]; then
              exit 0
            fi

            # 4xx other than 429 is a bad request or key problem; retrying will not help.
            if [ "$STATUS" -ge 400 ] && [ "$STATUS" -lt 500 ] && [ "$STATUS" -ne 429 ]; then
              break
            fi
            sleep $((ATTEMPT * 5))
          done

          echo "::error title=IndexNow::IndexNow returned $STATUS; no search engine was notified"
          exit 1

  # ─────────────────────────────────────────────────
  # Google: Search Console sitemap submission
  # Replaces the old Indexing API job, which was ineligible by design — Google
  # restricts that API to JobPosting and BroadcastEvent, and every URL here is a
  # marketing page or article.
  #
  # Skips cleanly when the secret is absent, and fails loudly when the secret is
  # present but unreadable, so "not configured" and "configured wrong" never look
  # alike again. See .github/scripts/submit-sitemap.mjs for what this does and
  # does not claim to achieve.
  # ─────────────────────────────────────────────────
  submit-sitemap:
    name: Submit sitemap to Google
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches monthly-seo-review.yml. Both actions raise a Node 20
          # deprecation warning on the runner; bumping them is a separate change.
          node-version: '22'

      # No `npm install`: the script and its two libraries use Node built-ins only.
      - name: Submit sitemap via Search Console API
        env:
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: node .github/scripts/submit-sitemap.mjs

# REMOVED: the "Ping Google Sitemap" job. It called
# https://www.google.com/ping?sitemap=..., which Google deprecated in June 2023.
# The job's own comment said "404 is expected", so it reported success on every
# deploy while doing nothing. Google's replacement guidance is to submit through
# Search Console, which the job above now does.
